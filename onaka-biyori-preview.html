ption{font-size:17px}.tips{padding:20px 16px}.tips h2{font-size:18px}.tips li{font-size:16px}.consultation h2{font-size:19px}.result-art svg{width:160px}.privacy{font-size:11px}footer{font-size:12px}footer small{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><header><a href="./"><b>✿</b> おなか日和</a><span>わたしをいたわる、小さな習慣。</span></header><main id="app"></main><footer>おなか日和 ・ わたしのお腹と、なかよく。<br><small>生活習慣を振り返るためのデモです。医学的な診断ではありません。</small></footer><template id="mascot"><svg viewBox="0 0 320 280" role="img" aria-label="にっこり笑うピンク色の腸のキャラクター"><ellipse cx="162" cy="253" rx="88" ry="12" fill="#efd7bc"/><path d="M108 215Q65 231 62 189V87Q62 53 99 55H222Q260 55 260 90V188Q260 219 230 219H205" fill="#ffd0c8" stroke="#bc7063" stroke-width="5" stroke-linecap="round"/><path d="M105 92H207Q230 92 230 111Q230 128 210 128H114Q91 128 91 149Q91 168 114 168H207Q230 168 230 187Q230 207 205 207H146Q124 207 124 228" fill="none" stroke="#bc7063" stroke-width="29" stroke-linecap="round"/><path d="M105 92H207Q230 92 230 111Q230 128 210 128H114Q91 128 91 149Q91 168 114 168H207Q230 168 230 187Q230 207 205 207H146Q124 207 124 228" fill="none" stroke="#f6aaa5" stroke-width="20" stroke-linecap="round"/><g fill="#69483c"><ellipse cx="132" cy="145" rx="5" ry="7"/><ellipse cx="185" cy="145" rx="5" ry="7"/></g><path d="M148 154Q160 167 172 154" fill="none" stroke="#69483c" stroke-width="4" stroke-linecap="round"/><g fill="#ec8d88"><ellipse cx="116" cy="157" rx="11" ry="6"/><ellipse cx="201" cy="157" rx="11" ry="6"/></g><path d="M64 155Q34 142 34 160M259 156Q286 132 292 144M127 234L118 248M202 224L212 240" fill="none" stroke="#bc7063" stroke-width="6" stroke-linecap="round"/><path d="M145 51Q144 22 176 23Q179 47 145 51" fill="#93ab73"/><path d="M144 51Q122 29 107 38Q112 59 144 51" fill="#bbc793"/><g fill="#da9650"><path d="M40 69l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M278 202l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g></svg></template><noscript>診断にはJavaScriptを有効にしてください。</noscript><script>window.QUIZ_CONFIG = {
 consultationUrl: '',
 answers: ['あてはまらない','あまりあてはまらない','どちらともいえない','ややあてはまる','よくあてはまる'],
 score: [0,1,2,3,4],
 types: [
 {id:'fiber',name:'彩りごはんをプラスするタイプ',short:'食事の彩り',icon:'🥕',description:'毎日の食材のバリエーションに目を向けるきっかけがありそうです。いつもの食事に、小さな彩りを足してみましょう。',tips:['いつもの一品に、野菜や豆類を少し添えてみる。','食物繊維を含む食品は、体調を見ながら少しずつ取り入れる。','無理な制限より、食材の種類を楽しむ。']},
 {id:'water',name:'こまめにうるおうタイプ',short:'水分の習慣',icon:'🫖',description:'忙しさの中で、水分をとるタイミングが後回しになっているかもしれません。日々の動作と一緒に、飲み物を楽しんでみましょう。',tips:['起床時や食事のときなど、飲むタイミングを決めてみる。','手の届くところに、好みの飲み物を用意する。','水分の量は体調に合わせ、医師からの制限がある場合は指示を優先する。']},
 {id:'rhythm',name:'ゆったり食事リズムタイプ',short:'食事のリズム',icon:'☀️',description:'食事の時間や食べる速さを振り返ると、自分をいたわるヒントが見つかりそうです。できる日から落ち着いて食べる時間を作りましょう。',tips:['食事の時間を、できる範囲で整える。','ひと口ずつ味わい、ときどき箸を置いてみる。','自分に合う食事のペースを探す。']},
 {id:'rest',name:'ほっとひと息タイプ',short:'休息とからだ',icon:'🌙',description:'日々の忙しさや休息のとり方に目を向けるきっかけがありそうです。自分がほっとできる時間を大切にしてみましょう。',tips:['就寝前に、画面から離れてくつろぐ。','無理のない散歩やストレッチを楽しむ。','深呼吸など、自分に合う気分転換を見つける。']},
 {id:'listen',name:'お腹の声を聴くタイプ',short:'お腹の振り返り',icon:'🌷',description:'お腹の様子やトイレの時間を振り返ると、日々の過ごし方のヒントが見つかるかもしれません。調子を決めつけず、やさしく見つめてみましょう。',tips:['トイレに行きたい気持ちを、できる範囲で我慢しない。','食事やお腹の様子を、自分のために振り返る。','気になる症状が続くときは、医療機関に相談する。']}
 ],
 questions: [
 {type:'fiber',text:'野菜を食べる機会が少ないと感じますか？'},
 {type:'water',text:'気づくと、長い時間水分をとっていないことがありますか？'},
 {type:'rhythm',text:'食事の時間が日によってばらばらですか？'},
 {type:'rest',text:'忙しくて、ほっとする時間が少ないと感じますか？'},
 {type:'listen',text:'お腹の様子を振り返る機会が少ないですか？'},
 {type:'fiber',text:'豆類・海藻・きのこを食べる機会が少ないですか？'},
 {type:'water',text:'食事以外の時間は、飲み物をあまり飲まないですか？'},
 {type:'rhythm',text:'食事を急いで済ませることが多いですか？'},
 {type:'rest',text:'睡眠で十分に休めていないと感じますか？'},
 {type:'listen',text:'トイレに行きたくても、後回しにすることがありますか？'},
 {type:'fiber',text:'いつも似た食材を選ぶことが多いですか？'},
 {type:'water',text:'外出中は、水分をとることを忘れがちですか？'},
 {type:'rhythm',text:'食事を抜いたり、まとめて食べたりすることがありますか？'},
 {type:'rest',text:'散歩や軽い運動をする機会が少ないですか？'},
 {type:'listen',text:'お腹の張りや便の様子の変化が、気になることがありますか？'}
 ]
};

(function(root){
root.calculateResult = function(config, answers){
 if(answers.length!==config.questions.length || answers.some(v=>!Number.isInteger(v)||v<1||v>5))throw new Error('すべての質問に回答してください');
 return config.types.map(type=>{const values=config.questions.flatMap((q,i)=>q.type===type.id?[config.score[answers[i]-1]]:[]);return {type,score:values.length?values.reduce((a,b)=>a+b,0)/values.length:-Infinity};}).reduce((best,current)=>current.score>best.score?current:best).type;
};
})(typeof window==='undefined'?globalThis:window);

const config=window.QUIZ_CONFIG, app=document.querySelector('#app');
const state={name:'',age:'',answers:[],index:0};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mascot=()=>document.querySelector('#mascot').innerHTML;
const privacy='<p class="privacy">♧ 入力情報・回答は外部に送信せず、保存しません。<br>ページを閉じたり再読み込みしたりすると消えます。</p>';
const notice='<aside class="notice"><strong>ご利用の前に</strong><p>タイプ・判定はデモ用です。医学的な診断や体質の断定を行うものではありません。気になる症状がある場合は、医療機関へご相談ください。</p></aside>';
function focusHeading(){const h=app.querySelector('h1');h.tabIndex=-1;h.focus({preventScroll:true});window.scrollTo(0,0);}
function home(focus=false){
 app.innerHTML=`<section class="hero"><div><p class="eyebrow">お腹を知ることは、自分を大切にすること。</p><span class="pill">約3分 ・ 全${config.questions.length}問</span><h1>わたしのお腹に、<br>やさしい<span class="underline">発見。</span></h1><p class="intro">毎日の食事や、お腹の調子。<br>少し立ち止まって、振り返ってみませんか？<br>あなたに合う腸活のヒントを見つけましょう。</p><div class="mini-features"><span>✓ かんたん5段階回答</span><span>✓ 自分のペースで</span></div></div><div class="hero-art"><div class="speech">がんばりすぎず、<br>いっしょに腸活♪</div>${mascot()}<span class="art-caption">お腹の案内役、おなかちゃん</span></div></section><section class="start-card"><div class="card-heading"><span class="step-dot">01</span><div><p class="eyebrow">LET'S START</p><h2>まずは、あなたのことを教えてください</h2></div></div><form id="start-form"><div class="fields"><label>ニックネーム <span class="required">必須</span><input name="nickname" autocomplete="off" maxlength="20" required placeholder="例：はなこ" value="${esc(state.name)}"><small>本名でなくて大丈夫です（20文字以内）</small></label><label>年代 <span class="required">必須</span><select name="age" required><option value="">選んでください</option>${['30代以下','40代','50代','60代','70代以上','回答しない'].map(x=>`<option ${state.age===x?'selected':''}>${x}</option>`).join('')}</select><small>年代によって判定は変わりません</small></label></div><button class="primary" type="submit">腸活タイプ診断をはじめる <span>→</span></button><p id="form-error" role="alert"></p>${privacy}</form></section>${notice}`;
 app.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target),name=data.get('nickname').trim();if(!name){app.querySelector('#form-error').textContent='ニックネームを入力してください。';return;}state.name=name;state.age=data.get('age');question();});if(focus)focusHeading();
}
function question(){
 const i=state.index,q=config.questions[i],category=config.types.find(t=>t.id===q.type);
 app.innerHTML=`<section class="quiz-card"><div class="quiz-top"><span class="pill">${esc(category.short)}</span><span>質問 <strong>${i+1}</strong> / ${config.questions.length}</span></div><progress max="${config.questions.length}" value="${i}" aria-label="回答済みの質問数"></progress><p class="eyebrow question-label">QUESTION ${String(i+1).padStart(2,'0')}</p><h1>${esc(q.text)}</h1><p class="help">最近のご自身に近いものを選んでください。</p><div class="answers">${config.answers.map((text,n)=>`<button class="answer ${state.answers[i]===n+1?'selected':''}" data-value="${n+1}" aria-pressed="${state.answers[i]===n+1}"><span class="answer-number">${n+1}</span>${esc(text)}<span class="answer-arrow">${state.answers[i]===n+1?'✓':'›'}</span></button>`).join('')}</div><p class="tap-note">タップすると、次の画面に進みます</p><button class="text-button" id="back">← ${i===0?'入力画面に戻る':'前の質問に戻る'}</button><div class="quiz-bottom"><div>${mascot()}</div><p>正解・不正解はありません。<br>いつものあなたで大丈夫。</p></div></section>`;
 app.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>{state.answers[i]=Number(b.dataset.value);if(i+1===config.questions.length)result();else{state.index++;question();}}));
 app.querySelector('#back').addEventListener('click',()=>{if(state.index===0)home(true);else{state.index--;question();}});focusHeading();
}
function result(){
 const type=calculateResult(config,state.answers);
 app.innerHTML=`<section class="result-card"><span class="pill">デモ用のタイプ判定</span><p class="result-name">${esc(state.name)}さんの、今の振り返り</p><div class="result-art">${mascot()}</div><p class="eyebrow">あなたへの腸活ヒントは…</p><h1>${esc(type.name)}</h1><p class="result-description">${esc(type.description)}</p><div class="tips"><h2>${type.icon} 今日からできる、小さな一歩</h2><ol>${type.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><p class="demo-note">回答をもとに、5つの仮タイプから1つを表示しています。体質や腸の健康状態を示す結果ではありません。</p><div class="consultation"><h2>ひとりで悩まず、話してみませんか？</h2><p>毎日の習慣を見直すきっかけに。</p><div id="consult-action"></div><p class="consult-note" id="consult-note"></p></div><button class="secondary" id="retry">もう一度診断する ↻</button><button class="text-button" id="review">← 最後の質問に戻る</button>${privacy}</section>${notice}`;
 let url;try{url=new URL(config.consultationUrl);if(!['https:','http:'].includes(url.protocol))url=null;}catch{url=null;}
 if(url){const a=document.createElement('a');a.className='primary';a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.referrerPolicy='no-referrer';a.textContent='個別相談のご案内 →';app.querySelector('#consult-action').append(a);app.querySelector('#consult-note').textContent='外部ページを開きます。診断の入力・回答は引き継ぎません。';}
 else{app.querySelector('#consult-action').innerHTML='<button class="primary" disabled>個別相談のご案内（準備中）</button>';app.querySelector('#consult-note').textContent='相談先のURLは、後日設定予定です。';}
 app.querySelector('#retry').addEventListener('click',()=>{Object.assign(state,{name:'',age:'',answers:[],index:0});home(true);});app.querySelector('#review').addEventListener('click',()=>{state.index=config.questions.length-1;question();});focusHeading();
}
home();
</script></body></html>
