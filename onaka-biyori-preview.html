 {id:'round',name:'ぽんぽこ腸ちゃん',color:'#f3ba9b',symbol:'○',profile:{fiber:0.5,water:0.5,rhythm:0,rest:0,listen:1},description:'お腹の様子やトイレのタイミングに、目を向けたいキャラ。日々の小さな変化を、やさしく振り返りたいあなたに。',tips:['トイレのタイミングや、お腹の様子を振り返る。','食材を急に増やさず、自分のペースで試す。']},

(function(root){
root.calculateResult = function(config, answers){
 if(answers.length!==config.questions.length || answers.some(v=>!Number.isInteger(v)||v<1||v>5))throw new Error('すべての質問に回答してください');
 const min=Math.min(...config.score),range=Math.max(...config.score)-min;
 if(range<=0)throw new Error('配点には差を設定してください');
 const averages=Object.fromEntries(Object.keys(config.categories).map(category=>{
  const values=config.questions.flatMap((q,i)=>q.type===category?[(config.score[answers[i]-1]-min)/range]:[]);
  if(!values.length)throw new Error('各観点に質問が必要です');
  return [category,values.reduce((a,b)=>a+b,0)/values.length];
 }));
 return config.types.map(type=>({type,distance:Object.entries(averages).reduce((sum,[key,value])=>sum+(value-type.profile[key])**2,0)})).reduce((best,current)=>current.distance<best.distance?current:best).type;
};
})(typeof window==='undefined'?globalThis:window);

const config=window.QUIZ_CONFIG, app=document.querySelector('#app');
document.title=config.title+' | おなか日和';
const state={name:'',age:'',answers:[],index:0};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mascot=(type)=>{
 let svg=document.querySelector('#mascot').innerHTML;
 if(!type)return svg;
 svg=svg.replace('にっこり笑うピンク色の腸のキャラクター',esc(type.name)+'のイラスト').replaceAll('#f6aaa5',type.color).replaceAll('#ffd0c8',type.color);
 if(type.id==='relaxed')svg=svg.replace('<ellipse cx="132" cy="145" rx="5" ry="7"/>','<path d="M125 145h14" stroke="#69483c" stroke-width="4" stroke-linecap="round"/>').replace('<ellipse cx="185" cy="145" rx="5" ry="7"/>','<path d="M178 145h14" stroke="#69483c" stroke-width="4" stroke-linecap="round"/>');
 if(type.id==='round')svg=svg.replace('M148 154Q160 167 172 154','M153 156Q160 149 167 156Q160 169 153 156');

};
const privacy='<p class="privacy">♧ 入力情報・回答は外部に送信せず、保存しません。<br>ページを閉じたり再読み込みしたりすると消えます。</p>';
const notice='<aside class="notice"><strong>ご利用の前に</strong><p>タイプ・判定はデモ用です。医学的な診断や体質の断定を行うものではありません。気になる症状がある場合は、医療機関へご相談ください。</p></aside>';
function focusHeading(){const h=app.querySelector('h1');h.tabIndex=-1;h.focus({preventScroll:true});window.scrollTo(0,0);}
function home(focus=false){
 app.innerHTML=`<section class="hero"><div><p class="eyebrow">お腹を知ることは、自分を大切にすること。</p><span class="pill">約3分 ・ 全${config.questions.length}問</span><h1>${esc(config.title).replace('あなたの腸は','あなたの腸は<br>').replace('5つの腸キャラ診断','<br><span class="underline">5つの腸キャラ診断</span>')}</h1><p class="intro">毎日の食事や、お腹の調子。<br>少し立ち止まって、振り返ってみませんか？<br>今のあなたに近い腸キャラを見つけましょう。</p><div class="mini-features"><span>✓ かんたん5段階回答</span><span>✓ 自分のペースで</span></div></div><div class="hero-art"><div class="speech">がんばりすぎず、<br>いっしょに腸活♪</div>${mascot()}<span class="art-caption">お腹の案内役、おなかちゃん</span></div></section><section class="start-card"><div class="card-heading"><span class="step-dot">01</span><div><p class="eyebrow">LET'S START</p><h2>まずは、あなたのことを教えてください</h2></div></div><form id="start-form"><div class="fields"><label>ニックネーム <span class="required">必須</span><input name="nickname" autocomplete="off" maxlength="20" required placeholder="例：はなこ" value="${esc(state.name)}"><small>本名でなくて大丈夫です（20文字以内）</small></label><label>年代 <span class="required">必須</span><select name="age" required><option value="">選んでください</option>${['30代以下','40代','50代','60代','70代以上','回答しない'].map(x=>`<option ${state.age===x?'selected':''}>${x}</option>`).join('')}</select><small>年代によって判定は変わりません</small></label></div><button class="primary" type="submit">腸キャラ診断をはじめる <span>→</span></button><p id="form-error" role="alert"></p>${privacy}</form></section>${notice}`;

}
function question(){
 const i=state.index,q=config.questions[i],category=config.categories[q.type];
 app.innerHTML=`<section class="quiz-card"><div class="quiz-top"><span class="pill">${esc(category)}</span><span>質問 <strong>${i+1}</strong> / ${config.questions.length}</span></div><progress max="${config.questions.length}" value="${i}" aria-label="回答済みの質問数"></progress><p class="eyebrow question-label">QUESTION ${String(i+1).padStart(2,'0')}</p><h1>${esc(q.text)}</h1><p class="help">最近のご自身に近いものを選んでください。</p><div class="answers">${config.answers.map((text,n)=>`<button class="answer ${state.answers[i]===n+1?'selected':''}" data-value="${n+1}" aria-pressed="${state.answers[i]===n+1}"><span class="answer-number">${n+1}</span>${esc(text)}<span class="answer-arrow">${state.answers[i]===n+1?'✓':'›'}</span></button>`).join('')}</div><p class="tap-note">タップすると、次の画面に進みます</p><button class="text-button" id="back">← ${i===0?'入力画面に戻る':'前の質問に戻る'}</button><div class="quiz-bottom"><div>${mascot()}</div><p>正解・不正解はありません。<br>いつものあなたで大丈夫。</p></div></section>`;
